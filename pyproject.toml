[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omneva"
version = "1.4.0"
description = "Native cross-platform media player, transcoder, and converter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Meetkumar Patel", email = "pmeet464@gmail.com"}]

dependencies = [
    "PySide6>=6.6.0",
    "python-vlc>=3.0.20",
    "numpy>=1.21.0",
    "yt-dlp>=2023.1.0",
    "requests>=2.28.0",
    "sentry-sdk>=1.29.0",
]

[project.scripts]
omneva = "main:main"

[tool.setuptools.packages.find]
where = ["."]
